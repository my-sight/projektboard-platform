services:
  # 1. Database
  db:
    container_name: supabase-db
    image: supabase/postgres:15.1.0.147
    hostname: db
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    restart: always
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
      - ./volumes/db/init:/docker-entrypoint-initdb.d:ro

  # 2. REST API (PostgREST)
  rest:
    container_name: supabase-rest
    image: postgrest/postgrest:v12.2.0
    hostname: rest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    links:
      - db:db
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  # 3. Auth Service (GoTrue)
  auth:
    container_name: supabase-auth
    image: supabase/gotrue:v2.158.1
    hostname: auth
    restart: always
    depends_on:
      db:
        condition: service_healthy
    links:
      - db:db
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://${NUC_IP}:8000/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://${NUC_IP}:3000
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600

  # 4. API Gateway (Kong)
  kong:
    container_name: supabase-kong
    image: kong:2.8.1
    hostname: kong
    restart: always
    ports:
      - "8000:8000/tcp"
      - "8443:8443/tcp"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      # Kong internal DNS is sensitive; we use the Docker bridge DNS
      KONG_DNS_RESOLVER: 127.0.0.11
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
    volumes:
      - ./volumes/api/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      - rest
      - auth
    links:
      - rest:rest
      - auth:auth

  # 5. Realtime
  realtime:
    container_name: supabase-realtime
    image: supabase/realtime:v2.28.32
    hostname: realtime
    restart: always
    depends_on:
      db:
        condition: service_healthy
    links:
      - db:db
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      JWT_SECRET: ${JWT_SECRET}
      REPLICATION_MODE: RLS
    command: >
      bash -c "sleep 5 && /app/bin/server"

  # 6. Storage
  storage:
    container_name: supabase-storage
    image: supabase/storage-api:v1.11.13
    hostname: storage
    restart: always
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    links:
      - db:db
      - rest:rest
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
    volumes:
      - ./volumes/storage:/var/lib/storage

  # 7. Studio (Dashboard)
  studio:
    container_name: supabase-studio
    image: supabase/studio:latest
    hostname: studio
    restart: always
    ports:
      - "3001:3000"
    links:
      - kong:kong
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://${NUC_IP}:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}

  # 8. Meta (PG Meta)
  meta:
    container_name: supabase-meta
    image: supabase/postgres-meta:v0.84.2
    hostname: meta
    restart: always
    depends_on:
      db:
        condition: service_healthy
    links:
      - db:db
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  # 9. YOUR APP
  app:
    container_name: projektboard-app
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://${NUC_IP}:8000
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    restart: always
    ports:
      - "3000:3000"
    hostname: app
    depends_on:
      - kong
      - db
    links:
      - kong:kong
      - kong:supabase-kong
    environment:
      NEXT_PUBLIC_SUPABASE_URL: http://${NUC_IP}:8000
      SUPABASE_URL: http://kong:8000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
