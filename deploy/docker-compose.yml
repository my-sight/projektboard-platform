# supabase services
services:
  # 1. Database (PostgreSQL)
  db:
    container_name: supabase-db
    image: supabase/postgres:15.1.0.147
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    restart: always
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
      - ./volumes/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - projektboard-network

  # 2. API Gateway (Kong)
  kong:
    container_name: supabase-kong
    image: kong:2.8.1
    restart: always
    ports:
      - "127.0.0.1:8000:8000/tcp"
      - "127.0.0.1:8443:8443/tcp"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: A,CNAME
      KONG_DNS_RESOLVER: 127.0.0.11
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_TRUSTED_IPS: 0.0.0.0/0,::/0
    volumes:
      - ./volumes/api/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      - rest
      - auth
      - realtime
      - storage
      - meta
    networks:
      - projektboard-network

  # 3. Auth Service (GoTrue)
  auth:
    container_name: supabase-auth
    image: supabase/gotrue:v2.158.1
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${NEXT_PUBLIC_SUPABASE_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-http://localhost:3000}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
    networks:
      - projektboard-network

  # 4. REST API (PostgREST)
  rest:
    container_name: supabase-rest
    image: postgrest/postgrest:v12.2.0
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_LOG_LEVEL: info
    networks:
      - projektboard-network

  # 5. Realtime
  realtime:
    container_name: supabase-realtime
    image: supabase/realtime:v2.25.50
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${JWT_SECRET}
      APP_NAME: "realtime"
      REPLICATION_MODE: RLS
    command: >
      /app/bin/server
    networks:
      - projektboard-network

  # 6. Storage
  storage:
    container_name: supabase-storage
    image: supabase/storage-api:v1.11.13
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=storage,public,extensions
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      STORAGE_BACKEND: file
      TENANT_ID: stub
      # REGION and GLOBAL_S3_BUCKET are required by storage-api even for file backend
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      FILE_SIZE_LIMIT: 52428800
    volumes:
      - ./volumes/storage:/var/lib/storage
      # Mount backups for monitoring dashboard
      - ./backups:/backups:ro
      # Mount mdstat for RAID monitoring (Read-only)
      - /proc/mdstat:/host_mdstat:ro
    networks:
      - projektboard-network

  # 7. Studio (Dashboard)
  studio:
    container_name: supabase-studio
    image: supabase/studio:latest
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    networks:
      - projektboard-network

  # 8. Meta (PG Meta)
  meta:
    container_name: supabase-meta
    image: supabase/postgres-meta:v0.84.2
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - projektboard-network

  # 9. YOUR APP
  app:
    container_name: projektboard-app
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - kong
      - db
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      INTERNAL_SUPABASE_URL: http://kong:8000
    networks:
      - projektboard-network

networks:
  projektboard-network:
    driver: bridge
