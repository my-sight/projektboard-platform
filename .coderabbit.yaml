language: de-DE

reviews:
  profile: chill
  path_filters:
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/node_modules/**"
    - "!public/**"
    - "!docs/**"
    - "!**/*.diff"
    - "!**/*.md"
    - "!**/i18n/**"
    - "!**/.next/**"
    - "!**/out/**"
    - "!**/*.svg"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!srv/mysight/**"        # Schließt den kompletten srv-Zweig aus
    - "!var/www/mysight/**"    # Schließt den kompletten var-Zweig aus
    - "!src/styles/**"         # CSS/SCSS Dateien haben oft viele Zeilen, aber wenig Logik
    - "!src/types/**"          # TypeScript Definitionen ausschließen
    - "!src/constants/**"      # Konstanten-Dateien ausschließen
    - "!*.config.mjs"
    - "!*.json"
    - "!next.config.js"
