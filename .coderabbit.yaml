language: de-DE

reviews:
  profile: chill
  path_filters:
    - "!**/package-lock.json"
    - "!**/node_modules/**"
    - "!public/**"            # Ignoriert die SVGs/Logos
    - "!docs/**"              # Ignoriert Dokumentation
    - "!**/*.diff"            # Ignoriert deine "modifications.diff"
    - "!srv/mysight/supabase/**" # Supabase Configs brauchen oft kein Review
    - "!var/www/mysight/index.html"
    - "!**/*.md"              # Ignoriert READMEs
    - "!i18n/**"              # Übersetzungstabellen sind oft riesig
