language: de-DE

reviews:
  profile: chill
  path_filters:
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/node_modules/**"
    - "!public/**"
    - "!docs/**"
    - "!**/*.diff"
    - "!**/*.md"
    - "!**/i18n/**"           # Schließt alle Sprachdateien aus
    - "!**/.next/**"
    - "!**/out/**"
    - "!**/*.svg"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!srv/mysight/configs/**" # Schließt Konfigurations-Ordner aus
    - "!var/www/mysight/**"     # Schließt den Web-Pfad aus
    - "!*.config.mjs"           # Schließt alle Root-Configs aus (eslint, postcss etc.)
    - "!*.json"                 # Schließt tsconfig.json, package.json etc. aus
    - "!next.config.js"
