language: de-DE

reviews:
  profile: chill
  path_filters:
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/node_modules/**"
    - "!public/**"
    - "!docs/**"
    - "!**/*.diff"
    - "!**/*.md"
    - "!**/i18n/**"
    - "!**/.next/**"
    - "!**/out/**"
    - "!**/*.svg"
    - "!**/*.png"
    - "!srv/**"              # Radikal: Alles in srv ignorieren
    - "!var/**"              # Radikal: Alles in var ignorieren
    - "!src/styles/**"
    - "!src/theme/**"        # Neu: Theme-Definitionen (Farben, Fonts) ausschließen
    - "!src/contexts/**"     # Neu: Context-Boilerplate ausschließen
    - "!src/lib/**"          # Neu: Externe Library-Wrapper ausschließen
    - "!src/types/**"
    - "!*.config.mjs"
    - "!*.json"
    - "!next.config.js"
