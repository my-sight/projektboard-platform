language: de-DE

reviews:
  profile: chill
  path_filters:
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/node_modules/**"
    - "!public/**"
    - "!docs/**"
    - "!**/*.diff"
    - "!**/*.md"
    - "!**/i18n/**"
    - "!**/.next/**"          # Next.js Build-Dateien (falls versehentlich eingecheckt)
    - "!**/out/**"            # Statischer Export
    - "!**/build/**"
    - "!**/dist/**"
    - "!**/*.svg"             # Alle Icons ausschließen
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.ico"
    - "!srv/mysight/supabase/**"
    - "!var/www/mysight/index.html"
    - "!eslint.config.mjs"    # Konfigurationsdateien meist unnötig für Logik-Review
    - "!tsconfig.json"
    - "!next.config.js"
